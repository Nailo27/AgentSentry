
name: AgentSentry CI Tests

on:
  push:
    branches:
      - integration/sprint2
      - 'ci/**'

  pull_request:
    branches:
      - main
      - integration/sprint2

permissions:
  contents: read

jobs:
  pytest-target-agent:
    name: pytest target agent
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/target-agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install target agent and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run target agent tests
        run: python -m pytest -q

  pytest-dashboard:
    name: pytest dashboard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      
      - name: Install dashboard dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"

      - name: Run dashboard tests
        run: python -m pytest -q tests