name: Target agent tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest-target-agent:
    name: pytest target agent
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/target-agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install target agent and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run tests
        run: python -m pytest -q
