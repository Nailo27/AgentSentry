[project]
name = "agentsentry-target-agent"
version = "0.1.0"
description = "Controlled, observable target agent for AgentSentry assessments"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]

