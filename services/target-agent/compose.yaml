services:
  agent:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      POLICY_GATEWAY_URL: http://gateway:8001
    depends_on: [gateway]
    networks: [agent_net]
  gateway:
    build: .
    command: ["uvicorn", "demo_gateway:app", "--host", "0.0.0.0", "--port", "8001"]
    networks: [agent_net]
networks:
  agent_net:
    internal: true

